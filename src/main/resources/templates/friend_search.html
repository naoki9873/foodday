<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>友達検索</title>
    <link rel="stylesheet" href="/css/dark-theme.css">
</head>
<body>

<h1>友達検索</h1>

<!-- 🔍 検索フォーム -->
<form th:action="@{/friends/search}" method="get">
    <input type="text" name="keyword" placeholder="検索キーワード">
    
    <!-- 👇 currentUserId を必ず渡す -->
    <input type="hidden" name="currentUserId" th:value="${currentUserId}">
    
    <button type="submit">検索</button>
</form>

<hr>

<!-- 🔍 検索結果 -->
<table border="1">
    <tr>
        <th>ユーザー名</th>
        <th>操作</th>
    </tr>

    <tr th:each="user : ${users}">
        <td th:text="${user.username}">ユーザー名</td>
        <td>
            <form th:action="@{/friends/follow}" method="post">
                
                <!-- ログインユーザー -->
                <input type="hidden" name="currentUserId" th:value="${currentUserId}" />
                
                <!-- フォロー対象ユーザー -->
                <input type="hidden" name="followUserId" th:value="${user.id}" />
                
                <button type="submit">フォロー</button>
            </form>
        </td>
    </tr>
</table>

<!-- フッター -->
<div th:replace="fragments/footer :: footer"></div>

</body>
</html>
